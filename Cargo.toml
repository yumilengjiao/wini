[package]
name = "yumi-wini"
version = "0.1.0"
edition = "2024"
description = "A scrollable-tiling window manager for Windows, inspired by Niri"

[dependencies]
log = "0.4"
env_logger = "0.11"
kdl = "6.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_Security",
] }
